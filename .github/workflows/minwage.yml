# 매년 다음 연도 최저임금을 자동으로 찾아 minwage.json에 반영합니다.
# - 8~12월 매달 1일·15일 (한국 시간 오전 9시 17분)에 실행
# - 저장소 Actions 탭에서 'Run workflow'로 바로 실행할 수도 있습니다.
name: 최저임금 자동 반영

on:
  schedule:
    - cron: '17 0 1,15 8-12 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 최저임금 찾기
        run: python scripts/update_minwage.py
      - name: 바뀌었으면 저장
        run: |
          if git diff --quiet minwage.json; then
            echo "변경 없음"
          else
            git config user.name "minwage-bot"
            git config user.email "minwage-bot@users.noreply.github.com"
            git add minwage.json
            git commit -m "최저임금 자동 반영 ($(date +%Y-%m-%d))"
            git push
          fi
